name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows
            extension: .exe
          - os: ubuntu-latest
            platform: Linux
            extension: ''
          - os: macos-latest
            platform: macOS
            extension: ''

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify tag matches app version
        id: version
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION="$(python -c 'from src.app_info import __version__; print(__version__)')"
          if [ "$TAG_VERSION" != "$APP_VERSION" ]; then
            echo "Release tag $GITHUB_REF_NAME does not match app version $APP_VERSION" >&2
            exit 1
          fi
          echo "version=$APP_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller build

      - name: Build executable
        shell: bash
        run: |
          PROJECT_ROOT="$(python -c 'from pathlib import Path; print(Path.cwd())')"
          if [ "${{ runner.os }}" = "Windows" ]; then
            DATA_SEP=';'
            ICON_ARGS=(--icon "$PROJECT_ROOT/src/deepbrid-favicon.ico")
          else
            DATA_SEP=':'
            ICON_ARGS=()
          fi
          python -m PyInstaller \
            --clean \
            --onefile \
            --noconsole \
            "${ICON_ARGS[@]}" \
            --name DeepbridDownloader \
            --distpath dist \
            --workpath build \
            --specpath build \
            --add-data "$PROJECT_ROOT/README.md${DATA_SEP}." \
            --add-data "$PROJECT_ROOT/src/deepbrid-logo.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/deepbrid-favicon.ico${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/deepbrid-wordmark.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/deepbrid-wordmark-light.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/file-host-links-dark.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/file-host-links-light.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/torrent-download-dark.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/torrent-download-light.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/usenet-globe-dark.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/usenet-globe-light.png${DATA_SEP}src" \
            --add-data "$PROJECT_ROOT/src/img${DATA_SEP}src/img" \
            launcher.py

      - name: Rename asset
        shell: bash
        run: |
          mkdir -p release-artifacts
          ASSET_NAME="DeepbridDownloader-${{ matrix.platform }}${{ matrix.extension }}"
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/DeepbridDownloader.exe "release-artifacts/$ASSET_NAME"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp dist/DeepbridDownloader "release-artifacts/$ASSET_NAME"
          else
            cp dist/DeepbridDownloader "release-artifacts/$ASSET_NAME"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: DeepbridDownloader-${{ matrix.platform }}-${{ steps.version.outputs.version }}${{ matrix.extension }}
          path: release-artifacts/DeepbridDownloader-${{ matrix.platform }}${{ matrix.extension }}

  checksums:
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-artifacts

      - name: Prepare release summary
        shell: bash
        run: git log -1 --format=%B "$GITHUB_SHA" > release-summary.md

      - name: Generate sha256 checksums
        shell: bash
        run: |
          cd release-artifacts
          find . -type f -not -name 'sha256sums.txt' -exec sha256sum {} \; > sha256sums.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            release-artifacts/**
          body_path: release-summary.md
          generate_release_notes: true
