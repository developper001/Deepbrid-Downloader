[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepbrid-downloader"
version = "0.2.0"
description = "A desktop downloader for Deepbrid-hosted files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
