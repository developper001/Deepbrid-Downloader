[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepbrid-downloader"
dynamic = ["version"]
description = "A desktop downloader for Deepbrid-hosted files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50.0.2",
  "filelock>=4.2.7",
  "platformdirs>=4.14.3",
  "tkinterdnd2>=0.7.0",
  "websocket-client>=1.9.2",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.package-data]
src = ["img/*", "screenshots/*"]

[tool.setuptools.dynamic]
version = {attr = "src.app_info.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
