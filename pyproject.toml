[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepbrid-downloader"
dynamic = ["version"]
description = "A desktop downloader for Deepbrid-hosted files"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "cryptography>=42",
  "filelock>=3.12",
  "platformdirs>=4",
  "websocket-client>=1.8",
]

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-dir]
"" = "."

[tool.setuptools.dynamic]
version = {attr = "src.app_info.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
